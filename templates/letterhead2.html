{% extends 'base.html' %}
{% block head %}
<style>
    .letterhead-workspace {
        padding: 1.5rem;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        background: #e9edf2;
    }
    .letterhead-paper {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: min(100%, 210mm);
        min-height: 297mm;
        margin: 0 auto;
        padding: 28mm 22mm 21mm;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #1e293b;
        box-shadow: 0 10px 32px rgb(15 23 42 / 12%);
        font-family: Arial, Helvetica, sans-serif;
    }
    .letterhead-top-art,
    .letterhead-bottom-art {
        position: absolute;
        right: 0;
        left: 0;
        height: 15mm;
        pointer-events: none;
    }
    .letterhead-top-art { top: 0; }
    .letterhead-bottom-art { bottom: 0; transform: rotate(180deg); }
    .letterhead-art-rule {
        position: absolute;
        top: 5mm;
        right: 0;
        left: 0;
        height: 2mm;
        background: #15364d;
    }
    .letterhead-art-orange {
        position: absolute;
        top: 9mm;
        right: 0;
        left: 0;
        height: 1mm;
        background: #e87516;
    }
    .letterhead-art-cut {
        position: absolute;
        top: 0;
        right: 21%;
        width: 24%;
        height: 15mm;
        background: #e87516;
        clip-path: polygon(0 0, 25% 0, 100% 100%, 75% 100%);
    }
    .letterhead-art-cut::after {
        position: absolute;
        top: 0;
        right: -34%;
        width: 70%;
        height: 100%;
        background: #15364d;
        clip-path: polygon(0 0, 30% 0, 100% 100%, 70% 100%);
        content: "";
    }
    .letterhead-logo { width: 62mm; height: 23mm; object-fit: contain; object-position: left center; }
    .letterhead-brand-note { border-left: 1px solid #e2e8f0; padding-left: 4mm; }
    .letterhead-copy {
        min-height: 105mm;
        color: #475569;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10pt;
        line-height: 1.8;
    }
    .letterhead-copy:empty::before {
        color: #94a3b8;
        content: attr(data-placeholder);
        pointer-events: none;
    }
    [contenteditable="true"] { outline: none; }
    .letterhead-editable { cursor: text; border-radius: 2px; }
    .letterhead-editable:empty::before {
        color: #94a3b8;
        content: attr(data-placeholder);
    }
    .letterhead-editable:hover,
    .letterhead-copy:hover { background-color: #f8fafc; }
    .letterhead-editable:focus,
    .letterhead-copy:focus { box-shadow: 0 1px 0 #e87516; }
    .letterhead-signature-line { width: 43mm; border-top: 1px solid #94a3b8; }
    @media (max-width: 767px) {
        .letterhead-workspace { padding: 0.5rem; border-radius: 0.75rem; }
        .letterhead-paper {
            min-height: 250mm;
            padding: 23mm 9mm 19mm;
        }
        .letterhead-logo { width: 48mm; height: 19mm; }
        .letterhead-copy { min-height: 90mm; font-size: 9.5pt; }
        .letterhead-art-cut { right: 15%; width: 31%; }
    }
    @media print {
        @page { size: A4 portrait; margin: 0; }
        html, body { width: 210mm; min-height: 297mm; background: #fff !important; }
        body * { visibility: hidden !important; }
        .letterhead-paper, .letterhead-paper * { visibility: visible !important; }
        .letterhead-paper {
            position: absolute;
            inset: 0 auto auto 0;
            width: 210mm;
            min-height: 297mm;
            margin: 0;
            padding: 28mm 22mm 21mm;
            border: 0;
            box-shadow: none;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact;
        }
        .letterhead-workspace { padding: 0; border: 0; background: #fff; }
        .letterhead-editable:hover,
        .letterhead-copy:hover { background: transparent; }
        .letterhead-editable:focus,
        .letterhead-copy:focus { box-shadow: none; }
        .letterhead-date-input { display: none !important; }
        .letterhead-date-print { display: inline !important; }
        .letterhead-copy:empty::before,
        .letterhead-editable:empty::before { content: none; }
    }
</style>
{% endblock %}
{% block content %}
<section class="mx-auto max-w-6xl space-y-5">
    <header class="no-print flex flex-wrap items-end justify-between gap-4">
        <div>
            <p class="text-xs font-black uppercase tracking-[0.2em] text-violet-700">Document tools</p>
            <h1 class="mt-1 text-2xl font-black text-slate-900">Letterhead Designer</h1>
            <p class="mt-1 text-sm text-slate-600">Set your details, write your letter, and print on A4 paper.</p>
        </div>
        <button id="print-letterhead" type="button" class="inline-flex items-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-slate-800">
            <i class="fa-solid fa-print" aria-hidden="true"></i> Print Letter
        </button>
    </header>

    <div class="no-print flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
        <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Choose letterhead company">
            <span class="px-2 text-[10px] font-black uppercase tracking-wider text-slate-400">Company</span>
            <button type="button" data-company="Canon" aria-pressed="true" class="company-choice rounded-lg bg-[#15364d] px-4 py-2 text-sm font-bold text-white">Canon</button>
            <button type="button" data-company="Haram" aria-pressed="false" class="company-choice rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700">Haram</button>
        </div>
        <div class="flex items-center gap-1 rounded-lg border border-slate-200 bg-slate-50 p-1" role="toolbar" aria-label="Letter formatting">
            <button type="button" data-command="bold" title="Bold" aria-label="Bold" class="format-command rounded-md px-3 py-2 font-black text-slate-700 hover:bg-white"><i class="fa-solid fa-bold" aria-hidden="true"></i></button>
            <button type="button" data-command="italic" title="Italic" aria-label="Italic" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-italic" aria-hidden="true"></i></button>
            <button type="button" data-command="underline" title="Underline" aria-label="Underline" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-underline" aria-hidden="true"></i></button>
            <span class="mx-1 h-6 border-l border-slate-200" aria-hidden="true"></span>
            <button type="button" data-command="insertUnorderedList" title="Bullet list" aria-label="Bullet list" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-list-ul" aria-hidden="true"></i></button>
            <button type="button" data-command="justifyLeft" title="Align left" aria-label="Align left" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-align-left" aria-hidden="true"></i></button>
            <button type="button" data-command="justifyCenter" title="Align center" aria-label="Align center" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-align-center" aria-hidden="true"></i></button>
            <button type="button" data-command="justifyRight" title="Align right" aria-label="Align right" class="format-command rounded-md px-3 py-2 text-slate-700 hover:bg-white"><i class="fa-solid fa-align-right" aria-hidden="true"></i></button>
        </div>
    </div>

    <div class="letterhead-workspace">
        <article id="letterhead-paper" class="letterhead-paper">
            <div class="letterhead-top-art" aria-hidden="true">
                <span class="letterhead-art-rule"></span>
                <span class="letterhead-art-orange"></span>
                <span class="letterhead-art-cut"></span>
            </div>

            <header class="flex min-h-[27mm] items-center justify-between gap-4 border-b border-slate-200 pb-4">
                <img id="letterhead-logo" src="{{ url_for('static', filename='canon logo black.webp') }}" alt="Canon Enterprises logo" class="letterhead-logo">
                <div class="letterhead-brand-note text-right">
                    <p class="text-[9px] font-black uppercase tracking-[0.2em] text-[#15364d]">Canon <span class="text-[#e87516]">&amp;</span> Haram</p>
                    <p class="mt-1 text-[8px] uppercase tracking-[0.16em] text-slate-400">Enterprises</p>
                </div>
            </header>

            <section class="mt-8 flex items-start justify-between gap-6 text-[10px] leading-relaxed text-slate-600">
                <div class="min-w-0">
                    <p class="mb-2 text-[8px] font-bold uppercase tracking-[0.2em] text-slate-400">To</p>
                    <p contenteditable="true" role="textbox" aria-label="Recipient name" data-placeholder="Recipient name" class="letterhead-editable min-h-4 font-bold text-[#15364d]"></p>
                    <p contenteditable="true" role="textbox" aria-label="Recipient title" data-placeholder="Title / company" class="letterhead-editable min-h-4 text-slate-500"></p>
                    <p contenteditable="true" role="textbox" aria-label="Recipient address and contact" data-placeholder="Address and contact details" class="letterhead-editable min-h-4 whitespace-pre-line text-slate-500"></p>
                </div>
                <label class="flex shrink-0 items-center gap-2 border-b border-slate-200 pb-1 text-[8px] font-bold uppercase tracking-[0.16em] text-[#e87516]">
                    Date
                    <input id="letter-date" type="date" class="letterhead-date-input border-0 bg-transparent p-1 text-[10px] font-medium normal-case tracking-normal text-slate-600 focus:ring-1 focus:ring-orange-300">
                    <span id="letter-date-print" class="letterhead-date-print hidden text-[10px] font-medium normal-case tracking-normal text-slate-700"></span>
                </label>
            </section>

            <section class="mt-8">
                <p contenteditable="true" role="textbox" aria-label="Subject" data-placeholder="Subject (optional)" class="letterhead-editable min-h-5 border-b border-slate-100 pb-2 text-[10px] font-bold text-[#15364d]"></p>
                <p contenteditable="true" role="textbox" aria-label="Salutation" data-placeholder="Dear Sir/Madam," class="letterhead-editable mt-6 min-h-5 text-[10px] font-bold text-slate-700"></p>
                <div class="letterhead-copy mt-4" contenteditable="true" role="textbox" aria-label="Letter content" aria-multiline="true" data-placeholder="Write your letter here..."></div>
            </section>

            <section class="mt-8 max-w-[65%] text-[10px] leading-relaxed text-slate-600">
                <p contenteditable="true" role="textbox" aria-label="Sign-off" data-placeholder="Sincerely," class="letterhead-editable min-h-4 italic"></p>
                <p contenteditable="true" role="textbox" aria-label="Sender name" data-placeholder="Your name" class="letterhead-editable mt-1 min-h-4 font-bold uppercase text-[#e87516]"></p>
                <p contenteditable="true" role="textbox" aria-label="Sender title" data-placeholder="Your title" class="letterhead-editable min-h-4 text-[9px] italic text-slate-500"></p>
                <div class="letterhead-signature-line mt-6"></div>
                <p class="mt-1 text-[8px] uppercase tracking-[0.16em] text-slate-400">Signature</p>
            </section>

            <footer class="mt-auto border-t border-slate-200 pt-4 text-right text-[9px] leading-relaxed text-slate-500">
                <p contenteditable="true" role="textbox" aria-label="Company contact details" data-placeholder="Add company phone, email, address or website" class="letterhead-editable min-h-4 whitespace-pre-line"></p>
            </footer>

            <div class="letterhead-bottom-art" aria-hidden="true">
                <span class="letterhead-art-rule"></span>
                <span class="letterhead-art-orange"></span>
                <span class="letterhead-art-cut"></span>
            </div>
        </article>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const logo = document.getElementById('letterhead-logo');
        const companyButtons = document.querySelectorAll('.company-choice');
        const letterBody = document.querySelector('.letterhead-copy');
        const dateInput = document.getElementById('letter-date');
        const datePrint = document.getElementById('letter-date-print');
        const logoUrls = {
            Canon: "{{ url_for('static', filename='canon logo black.webp') }}",
            Haram: "{{ url_for('static', filename='haram-black.png') }}"
        };
        const companyNames = {
            Canon: 'Canon Enterprises',
            Haram: 'Haram Enterprises'
        };
        const today = new Date();
        dateInput.value = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

        companyButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                const company = button.dataset.company;
                logo.src = logoUrls[company];
                logo.alt = companyNames[company] + ' logo';
                companyButtons.forEach(function (choice) {
                    const selected = choice === button;
                    choice.setAttribute('aria-pressed', String(selected));
                    choice.classList.toggle('bg-[#15364d]', selected);
                    choice.classList.toggle('text-white', selected);
                    choice.classList.toggle('border-slate-200', !selected);
                    choice.classList.toggle('bg-white', !selected);
                    choice.classList.toggle('text-slate-700', !selected);
                });
            });
        });

        document.querySelectorAll('.format-command').forEach(function (button) {
            button.addEventListener('mousedown', function (event) {
                event.preventDefault();
            });
            button.addEventListener('click', function () {
                letterBody.focus();
                document.execCommand(button.dataset.command, false, null);
            });
        });

        dateInput.addEventListener('change', function () {
            datePrint.textContent = dateInput.value
                ? new Date(dateInput.value + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
                : '';
        });
        dateInput.dispatchEvent(new Event('change'));

        document.getElementById('print-letterhead').addEventListener('click', function () {
            window.print();
        });
    });
</script>
{% endblock %}
