
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ status_code }} · {{ error_title }} | Canon Registry</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050d18;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050d18;
}

/* FULL WIDTH DESIGN */

.design-container {
    position: relative;

    width: 100vw;
    height: auto;

    aspect-ratio: 1672 / 941;

    flex-shrink: 0;

    background-image: url("{{ url_for('static', filename='canon-error-design.png') }}");
    background-position: center;
    background-size: 100% 100%;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* THANK YOU MESSAGE */

.thank-you {
    position: absolute;
    left: 9%;
    top: 54.5%;

    color: #f4b52f;

    font-size: clamp(7px, 0.85vw, 14px);
    font-weight: 800;
    letter-spacing: 1.2px;

    text-transform: uppercase;
    white-space: nowrap;

    text-shadow: 0 2px 8px #071321;
}

/* DASHBOARD BUTTON */

.home-button {
    position: absolute;

    left: 8.8%;
    top: 59.2%;

    width: 19.3%;
    height: 7.5%;

    border-radius: 12px;
    cursor: pointer;
}

/* BACK BUTTON */

.back-button {
    position: absolute;

    left: 29.7%;
    top: 59.2%;

    width: 12.1%;
    height: 7.5%;

    border-radius: 12px;
    cursor: pointer;
}

/* ACCESSIBILITY */

.home-button:focus-visible,
.back-button:focus-visible {
    outline: 3px solid white;
    outline-offset: 3px;
}

/* TABLET */

@media (max-width: 900px) {

    .thank-you {
        font-size: clamp(6px, 1vw, 10px);
        letter-spacing: .7px;
    }

    .home-button,
    .back-button {
        border-radius: 7px;
    }
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        width: 100%;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
    }

    .design-container {
        width: 100vw;
        height: auto;
        aspect-ratio: 1672 / 941;
    }

    .thank-you {
        font-size: clamp(4px, 1.5vw, 8px);
        letter-spacing: .4px;
    }

    .home-button {
        border-radius: 5px;
    }

    .back-button {
        border-radius: 5px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
    }
}

</style>
</head>

<body>

<main class="design-container" aria-label="Canon Registry server error">

    <!-- FACTORY DASHBOARD -->

    <a
        class="home-button"
        href="{{ url_for('index') }}"
        aria-label="Factory Dashboard">
    </a>

    <!-- GO BACK -->

    <a
        class="back-button"
        href="{{ url_for('index') if false else '#' }}"
        onclick="if(history.length > 1){history.back();return false;} window.location.href='{{ url_for('index') }}'; return false;"
        aria-label="Go Back">
    </a>

</main>

</body>
</html>
